name: Update LeetCode Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - run: pip install requests
      
      - name: Fetch Stats
        run: python .github/workflows/fetch_stats.py
        
      - name: Commit JSON only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode-stats.json
          git diff --cached --quiet || (git commit -m "🤖 Auto-update stats" && git push)
