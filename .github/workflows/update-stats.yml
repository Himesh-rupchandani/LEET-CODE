name: Update LeetCode Dashboard

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Fetch LeetCode data and create dashboard
        run: python .github/workflows/fetch_stats.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/leetcode-dashboard.svg
          git add assets/leetcode-stats.json

          git diff --cached --quiet || git commit -m "chore: refresh LeetCode dashboard"
          git push
